name: Upscale settings UI smoke

on:
  pull_request:
    paths:
      - 'src/components/upscale/**'
      - 'src/components/Header.tsx'
      - 'src/components/TierPurposeSelector.tsx'
      - 'src/components/AdvancedSettings.tsx'
      - 'src/components/FileList.tsx'
      - 'src/pages/UpscalerPage.tsx'
      - 'public/404.html'
      - 'index.html'
      - 'scripts/smoke-pages-deep-links.mjs'
      - 'src/lib/upscalers/studio.ts'
      - 'src/components/upscale/StudioLevelDock.tsx'
      - 'src/index.css'
      - 'scripts/smoke-upscale-ui.mjs'
      - '.github/workflows/upscale-ui-smoke.yml'

permissions:
  contents: read

jobs:
  mobile-ui:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install FFmpeg for mixed media browser fixture
        run: apt-get update && apt-get install -y ffmpeg
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Validate concept-2 desktop and mobile design, model sheet and snackbar
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/localvert-ui.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/upscale >/dev/null && break || sleep 1; done
          node scripts/smoke-upscale-ui.mjs
      - name: Build and test direct URLs against GitHub Pages-style 404 routing
        run: |
          npm run build
          test -s dist/404.html
          node scripts/smoke-pages-deep-links.mjs
