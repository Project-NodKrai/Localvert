name: Browser-only image generation UI and GPU routing

on:
  pull_request:
    paths:
      - 'src/lib/imageGeneration/**'
      - 'src/pages/ImageGeneratorPage.tsx'
      - 'src/styles/image-generation.css'
      - 'src/components/Header.tsx'
      - 'src/App.tsx'
      - 'src/pages/DetailsPage.tsx'
      - 'scripts/smoke-image-generation.mjs'
      - '.github/workflows/image-generation-smoke.yml'

permissions:
  contents: read

jobs:
  generator-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Verify browser-only UI and isolated mocked WebGPU results
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/localvert-image-generation.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/generate >/dev/null && break || sleep 1; done
          node scripts/smoke-image-generation.mjs
