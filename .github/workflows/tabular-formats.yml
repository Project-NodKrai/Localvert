name: Tabular format tests

on:
  pull_request:
    paths:
      - 'src/lib/converters/document.ts'
      - 'tests/document-converter.test.ts'
      - '.github/workflows/tabular-formats.yml'

permissions:
  contents: read

jobs:
  tabular-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx --test tests/document-converter.test.ts
      - run: npm run build
