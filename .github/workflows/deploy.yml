name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # 본인의 메인 브랜치 이름 확인

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 빌드 결과물이 저장되는 폴더
      - name: Wait until uploaded Pages artifact is queryable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response="$(curl -fsS --retry 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}/artifacts?name=github-pages")" || response=""
            count="$(printf '%s' "${response}" | jq -r '[.artifacts[]? | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)"
            if [[ "${count}" -ge 1 ]]; then
              echo "Pages artifact is available through Actions API"
              sleep 5
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact was uploaded but did not become queryable"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
